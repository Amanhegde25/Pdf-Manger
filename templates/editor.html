<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Editor — Edit, Annotate & Manage Pages</title>
    <meta name="description"
        content="A powerful PDF editor: add text, drawings, highlights, signatures, images, shapes. Delete, reorder, merge and extract pages.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='editor.css') }}">
</head>

<body>
    <div class="editor-page" id="editorPage">

        <!-- ===== Top Toolbar ===== -->
        <div class="editor-toolbar" id="editorToolbar">
            <div class="toolbar-left">
                <a href="/" class="toolbar-brand">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="m15 18-6-6 6-6" />
                    </svg>
                    <span>PDF Editor</span>
                </a>
                <div class="toolbar-divider"></div>

                <!-- Tools -->
                <button class="tool-btn active" data-tool="select" title="Select" id="toolSelect">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z" />
                    </svg>
                </button>

                <button class="tool-btn" data-tool="text" title="Add Text" id="toolText">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <polyline points="4 7 4 4 20 4 20 7" />
                        <line x1="9" y1="20" x2="15" y2="20" />
                        <line x1="12" y1="4" x2="12" y2="20" />
                    </svg>
                </button>

                <button class="tool-btn" data-tool="editText" title="Edit Existing Text" id="toolEditText">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
                    </svg>
                </button>

                <button class="tool-btn" data-tool="draw" title="Draw" id="toolDraw">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path
                            d="M12 19l7-7 3 3-7 7-3-3z" />
                        <path
                            d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z" />
                        <path d="M2 2l7.586 7.586" />
                        <circle cx="11" cy="11" r="2" />
                    </svg>
                </button>

                <button class="tool-btn" data-tool="highlight" title="Highlight" id="toolHighlight">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M9 11l-6 6v3h9l3-3" />
                        <path
                            d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4" />
                    </svg>
                </button>

                <button class="tool-btn" data-tool="image" title="Add Image" id="toolImage">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
                        <circle cx="8.5" cy="8.5" r="1.5" />
                        <polyline points="21 15 16 10 5 21" />
                    </svg>
                </button>

                <div style="position: relative;">
                    <button class="tool-btn" data-tool="shape" title="Shapes" id="toolShape">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
                        </svg>
                    </button>
                    <!-- Shape submenu -->
                    <div class="shape-submenu" id="shapeSubmenu">
                        <button class="shape-option active" data-shape="rect" title="Rectangle">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="3" width="18" height="18" rx="2" />
                            </svg>
                        </button>
                        <button class="shape-option" data-shape="circle" title="Circle">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="9" />
                            </svg>
                        </button>
                        <button class="shape-option" data-shape="line" title="Line">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="5" y1="19" x2="19" y2="5" />
                            </svg>
                        </button>
                        <button class="shape-option" data-shape="arrow" title="Arrow">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <line x1="5" y1="12" x2="19" y2="12" />
                                <polyline points="12 5 19 12 12 19" />
                            </svg>
                        </button>
                    </div>
                </div>

                <button class="tool-btn" data-tool="signature" title="Signature" id="toolSignature">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path
                            d="M2 17c1.5-2 3-3.5 4-4s2.5 1 3 2 2.5 2 4 0 3-4.5 4.5-5.5 2.5 1 3 2" />
                        <line x1="2" y1="21" x2="22" y2="21" />
                    </svg>
                </button>

                <div class="toolbar-divider"></div>

                <!-- Undo / Redo -->
                <div class="undo-redo-group">
                    <button class="tool-btn" id="btnUndo" title="Undo" disabled>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="1 4 1 10 7 10" />
                            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10" />
                        </svg>
                    </button>
                    <button class="tool-btn" id="btnRedo" title="Redo" disabled>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="23 4 23 10 17 10" />
                            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
                        </svg>
                    </button>
                </div>
            </div>

            <div class="toolbar-center">
                <!-- Zoom -->
                <div class="zoom-group">
                    <button class="tool-btn" id="btnZoomOut" title="Zoom Out">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <line x1="5" y1="12" x2="19" y2="12" />
                        </svg>
                    </button>
                    <span class="zoom-label" id="zoomLabel">100%</span>
                    <button class="tool-btn" id="btnZoomIn" title="Zoom In">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19" />
                            <line x1="5" y1="12" x2="19" y2="12" />
                        </svg>
                    </button>
                </div>
            </div>

            <div class="toolbar-right">
                <button class="toolbar-action-btn btn-download" id="btnDownload" disabled>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                        <polyline points="7 10 12 15 17 10" />
                        <line x1="12" y1="15" x2="12" y2="3" />
                    </svg>
                    Download PDF
                </button>
            </div>
        </div>

        <!-- ===== Editor Body ===== -->
        <div class="editor-body" id="editorBody">

            <!-- Left Sidebar — Thumbnails -->
            <div class="editor-sidebar" id="editorSidebar" style="display: none;">
                <div class="sidebar-header">
                    <h3>Pages</h3>
                    <div class="sidebar-actions">
                        <button class="sidebar-btn" id="btnAddPages" title="Add pages">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <line x1="12" y1="5" x2="12" y2="19" />
                                <line x1="5" y1="12" x2="19" y2="12" />
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="thumbnail-list" id="thumbnailList"></div>
            </div>

            <!-- Center — Canvas -->
            <div class="editor-canvas-area" id="canvasArea">
                <!-- Empty state (upload prompt) -->
                <div class="editor-empty-state" id="emptyState">
                    <div class="editor-dropzone" id="editorDropzone">
                        <div class="editor-dropzone-icon">📄</div>
                        <h3>Drop your PDF here</h3>
                        <p>or click to browse your files</p>
                        <button class="browse-btn" id="browseBtn">Choose PDF</button>
                    </div>
                </div>

                <!-- Canvas wrapper (hidden until PDF loaded) -->
                <div class="canvas-container-wrapper" id="canvasWrapper" style="display: none;">
                    <canvas id="pdfRenderCanvas"></canvas>
                    <canvas id="fabricCanvas"></canvas>
                </div>
            </div>

            <!-- Right Panel — Properties -->
            <div class="editor-properties" id="editorProperties" style="display: none;">
                <!-- Text Properties -->
                <div class="props-section" id="propsText" style="display: none;">
                    <div class="props-section-title">Text</div>
                    <div class="props-row">
                        <span class="props-label">Font Size</span>
                        <input type="number" class="props-input" id="propsFontSize" value="16" min="6" max="144">
                    </div>
                    <div class="props-row">
                        <span class="props-label">Color</span>
                        <input type="color" class="props-color-input" id="propsTextColor" value="#000000">
                    </div>
                    <div class="props-row">
                        <span class="props-label">Style</span>
                        <div class="props-btn-group">
                            <button class="props-style-btn" id="propsBold" title="Bold"><b>B</b></button>
                            <button class="props-style-btn" id="propsItalic" title="Italic"><i>I</i></button>
                        </div>
                    </div>
                    <div class="props-row">
                        <span class="props-label">Font</span>
                        <select class="props-select" id="propsFontFamily">
                            <option value="Arial">Arial</option>
                            <option value="Helvetica">Helvetica</option>
                            <option value="Times New Roman">Times New Roman</option>
                            <option value="Courier New">Courier New</option>
                            <option value="Georgia">Georgia</option>
                            <option value="Verdana">Verdana</option>
                        </select>
                    </div>
                    <div class="props-row" id="maskColorRow" style="display: none;">
                        <span class="props-label">Mask Background</span>
                        <input type="color" class="props-color-input" id="propsMaskColor" value="#ffffff" title="Background color used to cover original text">
                    </div>
                </div>

                <!-- Draw Properties -->
                <div class="props-section" id="propsDraw" style="display: none;">
                    <div class="props-section-title">Drawing</div>
                    <div class="props-row">
                        <span class="props-label">Brush Size</span>
                        <input type="number" class="props-input" id="propsBrushSize" value="3" min="1" max="50">
                    </div>
                    <div class="props-row">
                        <span class="props-label">Color</span>
                        <input type="color" class="props-color-input" id="propsDrawColor" value="#e63946">
                    </div>
                    <div class="props-row">
                        <span class="props-label">Opacity</span>
                        <input type="range" class="props-slider" id="propsDrawOpacity" min="0.1" max="1" step="0.05"
                            value="1">
                    </div>
                </div>

                <!-- Highlight Properties -->
                <div class="props-section" id="propsHighlight" style="display: none;">
                    <div class="props-section-title">Highlight</div>
                    <div class="props-row">
                        <span class="props-label">Color</span>
                        <input type="color" class="props-color-input" id="propsHighlightColor" value="#ffeb3b">
                    </div>
                    <div class="props-row">
                        <span class="props-label">Opacity</span>
                        <input type="range" class="props-slider" id="propsHighlightOpacity" min="0.1" max="0.8"
                            step="0.05" value="0.35">
                    </div>
                </div>

                <!-- Shape Properties -->
                <div class="props-section" id="propsShape" style="display: none;">
                    <div class="props-section-title">Shape</div>
                    <div class="props-row">
                        <span class="props-label">Fill</span>
                        <input type="color" class="props-color-input" id="propsShapeFill" value="#3a9cf5">
                    </div>
                    <div class="props-row">
                        <span class="props-label">Stroke</span>
                        <input type="color" class="props-color-input" id="propsShapeStroke" value="#1a7ae0">
                    </div>
                    <div class="props-row">
                        <span class="props-label">Stroke Width</span>
                        <input type="number" class="props-input" id="propsShapeStrokeWidth" value="2" min="0"
                            max="20">
                    </div>
                    <div class="props-row">
                        <span class="props-label">Opacity</span>
                        <input type="range" class="props-slider" id="propsShapeOpacity" min="0.1" max="1" step="0.05"
                            value="0.6">
                    </div>
                </div>

                <!-- Selected Object -->
                <div class="props-section" id="propsSelected" style="display: none;">
                    <div class="props-section-title">Selected Object</div>
                    <div class="props-row">
                        <button class="sig-btn sig-btn-clear" id="btnDeleteObject" style="width:100%">🗑️ Delete
                            Object</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- ===== Bottom Page Nav ===== -->
        <div class="editor-bottombar" id="editorBottombar" style="display: none;">
            <button class="page-nav-btn" id="btnPrevPage" disabled>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6" />
                </svg>
            </button>
            <div class="page-nav-info">
                <span>Page</span>
                <input type="number" class="page-nav-input" id="pageNavInput" value="1" min="1">
                <span>of <span id="totalPagesLabel">0</span></span>
            </div>
            <button class="page-nav-btn" id="btnNextPage" disabled>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <polyline points="9 6 15 12 9 18" />
                </svg>
            </button>
        </div>
    </div>

    <!-- ===== Signature Modal ===== -->
    <div class="signature-modal-overlay" id="signatureModal">
        <div class="signature-modal">
            <h3>✍️ Draw Your Signature</h3>
            <div class="signature-canvas-wrapper">
                <canvas id="signatureCanvas" width="420" height="160"></canvas>
            </div>
            <div class="signature-modal-actions">
                <button class="sig-btn sig-btn-clear" id="sigClear">Clear</button>
                <button class="sig-btn sig-btn-cancel" id="sigCancel">Cancel</button>
                <button class="sig-btn sig-btn-apply" id="sigApply">Apply Signature</button>
            </div>
        </div>
    </div>

    <!-- ===== Loading Overlay ===== -->
    <div class="editor-loading" id="editorLoading">
        <div class="spinner"></div>
        <div class="loading-text" id="loadingText">Loading PDF…</div>
    </div>

    <!-- ===== Toast ===== -->
    <div class="editor-toast" id="editorToast"></div>

    <!-- Hidden file inputs -->
    <input type="file" id="editorFileInput" accept=".pdf">
    <input type="file" id="imageFileInput" accept="image/*">
    <input type="file" id="addPagesInput" accept=".pdf">

    <!-- External Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

    <!-- Editor Script -->
    <script src="{{ url_for('static', filename='editor.js') }}" type="module"></script>
</body>

</html>
